{{- if not .Values.azure.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secret.name }}
  namespace: {{ .Values.secret.namespace }}
type: Opaque
stringData:
  apiKey: {{ required "azure.apiKey is required (or set azure.existingSecret)" .Values.azure.apiKey | quote }}
{{- end }}
